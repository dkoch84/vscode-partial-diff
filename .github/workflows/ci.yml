name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly on Sundays at midnight UTC - detect stale builds early
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Lint
      run: yarn lint

    - name: Build
      run: yarn compile:prod

    - name: Unit tests
      id: unit-tests
      run: |
        yarn test 2>&1 | tee test-output.txt
        # Extract test count from mocha output
        PASSING=$(grep -oP '\d+(?= passing)' test-output.txt || echo "0")
        echo "passing=$PASSING" >> $GITHUB_OUTPUT

    - name: Package
      id: package
      run: |
        yarn package 2>&1 | tee package-output.txt
        # Extract package info
        VSIX_FILE=$(ls -1 *.vsix 2>/dev/null | head -1)
        VSIX_SIZE=$(du -h "$VSIX_FILE" | cut -f1)
        echo "vsix_file=$VSIX_FILE" >> $GITHUB_OUTPUT
        echo "vsix_size=$VSIX_SIZE" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsix-node${{ matrix.node-version }}
        path: '*.vsix'
        retention-days: 7

    - name: Write job summary
      run: |
        echo "## 🔨 Build Summary (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| ✅ Unit Tests | ${{ steps.unit-tests.outputs.passing }} passing |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Package | ${{ steps.package.outputs.vsix_file }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📏 Size | ${{ steps.package.outputs.vsix_size }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Package Contents" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        grep -A 100 "Files included in the VSIX" package-output.txt | head -20 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  integration:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, insiders]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: yarn

    - run: yarn install --frozen-lockfile
    - run: yarn compile:prod
    - run: npx tsc -p .

    - name: Run VS Code integration tests
      id: integration-tests
      uses: coactions/setup-xvfb@v1
      with:
        run: yarn test:integration 2>&1 | tee $GITHUB_WORKSPACE/integration-output-raw.txt
      env:
        VSCODE_TEST_VERSION: ${{ matrix.vscode }}

    - name: Write job summary
      if: always()
      run: |
        echo "## 🧪 Integration Tests (VS Code ${{ matrix.vscode }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Debug: check for output files
        echo "Debug: Looking for output files in $GITHUB_WORKSPACE" >> $GITHUB_STEP_SUMMARY
        ls -la $GITHUB_WORKSPACE/integration-output*.txt 2>&1 | head -5 >> $GITHUB_STEP_SUMMARY || echo "No output files found" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Strip ANSI color codes for reliable parsing
        if [ -f $GITHUB_WORKSPACE/integration-output-raw.txt ]; then
          sed 's/\x1b\[[0-9;]*m//g' $GITHUB_WORKSPACE/integration-output-raw.txt > $GITHUB_WORKSPACE/integration-output.txt
        fi

        # Determine status
        OUTPUT_FILE="$GITHUB_WORKSPACE/integration-output.txt"
        if [ -f "$OUTPUT_FILE" ] && grep -q "failing" "$OUTPUT_FILE"; then
          STATUS="❌ Some tests failed"
        elif [ -f "$OUTPUT_FILE" ] && grep -q "passing" "$OUTPUT_FILE"; then
          STATUS="✅ All tests passed"
        else
          STATUS="⚠️ Unknown"
        fi

        echo "**Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "$OUTPUT_FILE" ]; then
          # Extract counts
          PASSING=$(grep -oP '\d+(?= passing)' "$OUTPUT_FILE" || echo "0")
          FAILING=$(grep -oP '\d+(?= failing)' "$OUTPUT_FILE" || echo "0")

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passing | $PASSING |" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILING" != "0" ]; then
            echo "| ❌ Failing | $FAILING |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to expand test output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Extract test results - look for checkmarks and test names
          grep -E "(✔|✓|✗|×|passing|failing)" "$OUTPUT_FILE" | head -15 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
        fi

  # Alert on scheduled build failures
  alert:
    needs: [build, integration]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'schedule'
    steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const title = `🔴 Scheduled build failed - ${new Date().toISOString().split('T')[0]}`;
          const body = `The weekly CI build failed. This may indicate dependency or VS Code API compatibility issues.\n\n[View run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'ci-failure'
          });

          if (!issues.some(i => i.title.includes('Scheduled build failed'))) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
          }
